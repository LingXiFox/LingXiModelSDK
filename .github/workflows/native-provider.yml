name: Native Providers

on:
  push:
    branches: [main, 'rewrite/2.0']
    paths:
      - 'core/**'
      - 'registry/**'
      - 'conformance/native/**'
      - 'schemas/provider-registry-v1.schema.json'
      - 'specs/provider-registry-v1.md'
      - 'specs/native-provider-v1.md'
      - 'sdk/go/native/**'
      - 'sdk/typescript/src/native/**'
      - 'sdk/typescript/tests/native.test.ts'
      - 'scripts/test-native-providers.sh'
      - '.github/workflows/native-provider.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'registry/**'
      - 'conformance/native/**'
      - 'schemas/provider-registry-v1.schema.json'
      - 'specs/provider-registry-v1.md'
      - 'specs/native-provider-v1.md'
      - 'sdk/go/native/**'
      - 'sdk/typescript/src/native/**'
      - 'sdk/typescript/tests/native.test.ts'
      - 'scripts/test-native-providers.sh'
      - '.github/workflows/native-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=registry/scripts python3 -m unittest discover -s registry/scripts -v

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test

  go-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race -v ./native

  ts-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/native.test.ts
