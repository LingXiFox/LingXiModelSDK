name: Stage 2.0.0-alpha.1 Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag version"
        required: true
        default: "2.0.0-alpha.1"

permissions:
  contents: read

jobs:
  stage-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: website/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Build website, gateway, and core release artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$VERSION" = "$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml)"
          mkdir -p dist
          git rev-parse HEAD > dist/COMMIT.txt
          cp LICENSE registry/registry.json core/include/lingxi_core.h docs/release-2.0.0-alpha.1.md dist/
          for arch in amd64 arm64; do
            (cd website && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../dist/lingxi-models-linux-$arch" .)
            (cd gateway && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../dist/lingxi-gateway-linux-$arch" .)
          done
          (cd core && cargo build --release --locked && cp target/release/liblingxi_core.so ../dist/liblingxi_core-linux-x86_64.so)
          (cd sdk/typescript && npm pack --pack-destination ../../dist)
          (cd dist && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lingxi-model-sdk-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
