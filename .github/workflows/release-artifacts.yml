name: Stage 2.0.0-alpha.1 Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag version"
        required: true
        default: "2.0.0-alpha.1"

jobs:
  stage-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build website, gateway, and core release artifacts
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd website && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../dist/lingxi-models-linux-$arch" .)
            (cd gateway && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../dist/lingxi-gateway-linux-$arch" .)
          done
          (cd core && cargo build --release && cp target/release/liblingxi_core.so ../dist/liblingxi_core-linux-x86_64.so)
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: lingxi-model-sdk-${{ inputs.version }}
          path: dist/
