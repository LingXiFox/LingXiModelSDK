name: Catalog SDKs

on:
  push:
    branches: [main, 'rewrite/2.0']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'sdk/**'
      - 'conformance/catalog/**'
      - 'schemas/**'
      - 'specs/catalog-v2.md'
      - 'scripts/test-catalog-sdks.sh'
      - '.github/workflows/catalog-sdks.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'sdk/**'
      - 'conformance/catalog/**'
      - 'schemas/**'
      - 'specs/catalog-v2.md'
      - 'scripts/test-catalog-sdks.sh'
      - '.github/workflows/catalog-sdks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race -v ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.ts

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '22'
      - run: |
          mkdir -p build/classes
          javac --release 22 -d build/classes src/main/java/cn/lingxifox/modelsdk/*.java src/test/java/cn/lingxifox/modelsdk/*.java
          java --enable-native-access=ALL-UNNAMED -cp build/classes cn.lingxifox.modelsdk.CatalogTestRunner

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Build the Rust core
        run: cargo build --locked --manifest-path core/Cargo.toml
      - name: Test Swift SDK
        env:
          LINGXI_CORE_LIB: ${{ github.workspace }}/core/target/debug/liblingxi_core.dylib
        run: swift test