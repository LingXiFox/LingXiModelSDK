name: Catalog SDKs

on:
  push:
    branches: [main, 'rewrite/2.0']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'sdk/**'
      - 'conformance/catalog/**'
      - 'schemas/**'
      - 'specs/catalog-v2.md'
      - 'scripts/test-catalog-sdks.sh'
      - '.github/workflows/catalog-sdks.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'sdk/**'
      - 'conformance/catalog/**'
      - 'schemas/**'
      - 'specs/catalog-v2.md'
      - 'scripts/test-catalog-sdks.sh'
      - '.github/workflows/catalog-sdks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race -v ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.ts

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo test

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          mkdir -p build/classes
          javac -d build/classes src/main/java/cn/lingxifox/modelsdk/*.java src/test/java/cn/lingxifox/modelsdk/*.java
          java -cp build/classes cn.lingxifox.modelsdk.CatalogTestRunner

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
